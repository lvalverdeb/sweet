[project]
name = "boti-sweet-config"
version = "0.1.0"
description = "Generic typed settings loading (YAML defaults + .env/environment overrides) for the Boti suite."
readme = "README.md"
authors = [
    { name = "Luis Valverde", email = "lvalverdeb@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "boti>=1.0.8,<2.0.0",
    "pydantic>=2.11",
    "pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"
