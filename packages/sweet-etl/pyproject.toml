[project]
name = "sweet-etl"
version = "0.1.0"
description = "Generic extract/transform/load pipeline abstractions for the Boti suite."
readme = "README.md"
authors = [
    { name = "Luis Valverde", email = "lvalverdeb@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "boti-data[dataframes]>=1.3.2,<2.0.0",
    "boti-dask>=1.0.6,<2.0.0",
    "sweet-config",
]

[project.entry-points."sweet.packages"]
etl = "sweet_etl"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
sweet-config = { workspace = true }
