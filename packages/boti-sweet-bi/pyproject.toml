[project]
name = "boti-sweet-bi"
version = "0.1.0"
description = "Stub BI package for the Boti suite: wired into the suite but not yet backed by a real BI runtime."
readme = "README.md"
authors = [
    { name = "Luis Valverde", email = "lvalverdeb@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "boti-sweet-config",
    "pydantic>=2.11",
]

[project.entry-points."boti_sweet.packages"]
bi = "boti_sweet_bi"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
boti-sweet-config = { workspace = true }
