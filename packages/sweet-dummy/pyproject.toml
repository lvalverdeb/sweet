readme = "README.md"
authors = [
    { name = "Luis Valverde", email = "lvalverdeb@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.entry-points."sweet.packages"]
dummy = "sweet_dummy"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"
