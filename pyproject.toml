[project]
name = "sweet"
version = "0.1.0"
description = "Deployable skeleton suite for the Boti ecosystem: concentrates global configuration and wires in optional packages (ETL, BI, ...) based on client needs."
readme = "README.md"
authors = [
    { name = "Luis Valverde", email = "lvalverdeb@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "sweet-config",
]

[project.optional-dependencies]
etl = ["sweet-etl"]
bi = ["sweet-bi"]
observability = ["sweet-observability"]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
sweet-config = { workspace = true }
sweet-etl = { workspace = true }
sweet-bi = { workspace = true }
sweet-observability = { workspace = true }
sweet-dummy = { workspace = true }

[dependency-groups]
dev = [
    "sweet-dummy",
    "ipykernel>=7.3.0",
    "mypy>=1.14.0",
    "notebook>=7.6.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "packages"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
exclude = ["tests/", "examples/", "packages/[^/]+/tests/"]
mypy_path = "src"
explicit_package_bases = true
